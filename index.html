<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>DANT-E — Il Viaggio di Dante</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;}
body{
  background:radial-gradient(ellipse at 50% 0%, #4a0000 0%, #1e0000 40%, #080000 100%);
  display:flex;align-items:center;justify-content:center;
  position:fixed;inset:0;
}
#menu-btn{
  position:fixed;top:14px;right:14px;z-index:200;
  width:46px;height:46px;
  background:rgba(80,10,0,0.85);
  border:2px solid #c8800a;border-radius:8px;
  cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;
  -webkit-tap-highlight-color:transparent;
}
#menu-btn:hover,#menu-btn:active{background:rgba(160,30,0,0.9);}
#menu-btn span{display:block;width:22px;height:2.5px;background:#FFD700;border-radius:2px;}
#qr-overlay{
  display:none;position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,0.88);
  align-items:center;justify-content:center;flex-direction:column;gap:16px;
}
#qr-overlay.open{display:flex;}
#qr-overlay img{
  width:min(75vw,300px);height:min(75vw,300px);
  border:4px solid #FFD700;border-radius:10px;
  box-shadow:0 0 30px rgba(255,160,0,0.5);
  image-rendering:pixelated;
}
#qr-overlay p{
  color:#e8c880;font-family:'Courier New',monospace;
  font-size:clamp(12px,3vw,14px);text-align:center;line-height:1.6;padding:0 20px;
}
#qr-overlay a{color:#ff9944;}
#qr-close{
  background:rgba(100,20,0,0.9);border:2px solid #c8800a;
  color:#FFD700;font-family:'Courier New',monospace;
  font-size:14px;font-weight:bold;padding:10px 32px;
  border-radius:6px;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
#qr-close:hover{background:rgba(180,40,0,0.9);}

/* Frame sized to its image ratio: 1264x848 = 1.4906 */
#frame-wrap{
  position:relative;
  width:min(100vw, calc(100vh * 1.4906));
  height:min(100vh, calc(100vw / 1.4906));
  overflow:hidden; /* clips game that overflows frame */
}
/* Frame overlay on top — transparent inside, decorative border */
#frame-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:fill;pointer-events:none;z-index:10;
  image-rendering:pixelated;
}
/* Game iframe:
   - Width fills inner hole exactly: left=4%, width=92%
   - Height = 92% * frame_ratio / game_ratio = 0.92*1.4906/1.6 * 100% = 85.7% of frame height
   - Positioned so DANT-E banner (top 17%) covers top of game
     top = 17.3% - (85.7%-72.2%) = 17.3% - 13.5% = 3.8%
   Result: game fills inner area wall-to-wall, frame decorations cover edges */
#game-iframe{
  position:absolute;
  left:4%;
  top:3.8%;
  width:92%;
  height:85.7%;
  border:none;z-index:5;background:#000;
}

/* Touch controls */
#touch-ui{
  display:none;position:fixed;
  bottom:0;left:0;right:0;
  height:clamp(90px,18vh,120px);z-index:150;pointer-events:none;
}
#touch-ui button{
  position:absolute;
  width:clamp(52px,10vw,70px);height:clamp(52px,10vw,70px);
  border-radius:50%;border:3px solid rgba(255,200,60,0.6);
  background:rgba(0,0,0,0.5);color:rgba(255,220,100,0.95);
  font-size:clamp(18px,4vw,26px);font-weight:bold;
  cursor:pointer;pointer-events:all;
  -webkit-tap-highlight-color:transparent;
  user-select:none;touch-action:none;
  display:flex;align-items:center;justify-content:center;
}
#touch-ui button:active{background:rgba(200,80,0,0.55);border-color:rgba(255,220,80,0.9);}
#tbtn-l{left:12px;bottom:12px;}
#tbtn-r{left:calc(12px + clamp(60px,11vw,82px));bottom:12px;}
#tbtn-j{right:12px;bottom:12px;}
#tbtn-j2{right:calc(12px + clamp(60px,11vw,82px));bottom:12px;}
@media (pointer:coarse){#touch-ui{display:block;}}
</style>

<script>

function toggleQR(){document.getElementById('qr-overlay').classList.toggle('open');}
function closeQR(e){
  var t=e?e.target:null;
  var ov=document.getElementById('qr-overlay');
  var cl=document.getElementById('qr-close');
  if(!e||t===ov||t===cl) ov.classList.remove('open');
}
var iframe=document.getElementById('game-iframe');
function tb(btn,pressed){
  try{iframe.contentWindow.postMessage({type:'touch',btn:btn,pressed:pressed},'*');}catch(e){}
}
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
if(screen.orientation&&screen.orientation.lock){screen.orientation.lock('landscape').catch(function(){});}

</script>
