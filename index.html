<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>DANT-E — Il Viaggio di Dante</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;}
body{
  background:radial-gradient(ellipse at 50% 0%, #4a0000 0%, #1e0000 40%, #080000 100%);
  display:flex;align-items:center;justify-content:center;
  position:fixed;inset:0;
}
#menu-btn{
  position:fixed;top:14px;right:14px;z-index:200;
  width:46px;height:46px;
  background:rgba(80,10,0,0.85);
  border:2px solid #c8800a;border-radius:8px;
  cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;
  -webkit-tap-highlight-color:transparent;
}
#menu-btn:hover,#menu-btn:active{background:rgba(160,30,0,0.9);}
#menu-btn span{display:block;width:22px;height:2.5px;background:#FFD700;border-radius:2px;}
#qr-overlay{
  display:none;position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,0.88);
  align-items:center;justify-content:center;flex-direction:column;gap:16px;
}
#qr-overlay.open{display:flex;}
#qr-overlay img{
  width:min(75vw,300px);height:min(75vw,300px);
  border:4px solid #FFD700;border-radius:10px;
  box-shadow:0 0 30px rgba(255,160,0,0.5);
  image-rendering:pixelated;
}
#qr-overlay p{
  color:#e8c880;font-family:'Courier New',monospace;
  font-size:clamp(12px,3vw,14px);text-align:center;line-height:1.6;padding:0 20px;
}
#qr-overlay a{color:#ff9944;}
#qr-close{
  background:rgba(100,20,0,0.9);border:2px solid #c8800a;
  color:#FFD700;font-family:'Courier New',monospace;
  font-size:14px;font-weight:bold;padding:10px 32px;
  border-radius:6px;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
#qr-close:hover{background:rgba(180,40,0,0.9);}

/* Frame sized to its image ratio: 1264x848 = 1.4906 */
#frame-wrap{
  position:relative;
  width:min(100vw, calc(100vh * 1.4906));
  height:min(100vh, calc(100vw / 1.4906));
  overflow:hidden;
}
/* Frame overlay on top — transparent inside, decorative border */
#frame-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:fill;pointer-events:none;z-index:10;
  image-rendering:pixelated;
}
/* Game iframe:
   - Width fills inner hole exactly: left=4%, width=92%
   - Height = 92% * frame_ratio / game_ratio = 0.92*1.4906/1.6 * 100% = 85.7% of frame height
   - Positioned so DANT-E banner (top 17%) covers top of game
     top = 17.3% - (85.7%-72.2%) = 17.3% - 13.5% = 3.8%
   Result: game fills inner area wall-to-wall, frame decorations cover edges */
#game-iframe{
  position:absolute;
  left:4%;
  top:4.8%;
  width:92%;
  height:85.7%;
  border:none;z-index:5;background:#000;
}

/* Touch controls - only visible during gameplay */
#touch-ui{
  display:none;
  position:fixed;inset:0;
  pointer-events:none;
  z-index:150;
  transition:opacity 0.2s;
}
#touch-ui.active{display:block;}
/* Base button style: small, square, rounded, white transparent */
#touch-ui button{
  position:absolute;
  width:48px;height:48px;
  border-radius:10px;
  border:2px solid rgba(255,255,255,0.55);
  background:rgba(255,255,255,0.18);
  color:rgba(255,255,255,0.85);
  font-size:18px;font-weight:bold;
  cursor:pointer;pointer-events:all;
  -webkit-tap-highlight-color:transparent;
  user-select:none;touch-action:none;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(2px);
}
#touch-ui button:active{
  background:rgba(255,255,255,0.35);
  border-color:rgba(255,255,255,0.8);
}
/* Left side: move buttons */
#tbtn-l{ left:14px; bottom:20px; }
#tbtn-r{ left:72px; bottom:20px; }
/* Right side: jump */
#tbtn-j{ right:14px; bottom:20px; }
/* Menu: small, top-right inside touch area */
#tbtn-menu{
  right:14px; top:14px;
  width:38px;height:38px;
  font-size:13px;
  background:rgba(0,0,0,0.35);
  border-color:rgba(255,255,255,0.35);
}
@media (pointer:coarse){
  /* Only show on actual touch devices */
  #touch-ui{display:none;} /* JS controls visibility */
}
</style>
</head>

<script>
function toggleQR(){
  document.getElementById('qr-overlay').classList.toggle('open');
}
function closeQR(e){
  var t=e?e.target:null;
  var ov=document.getElementById('qr-overlay');
  var cl=document.getElementById('qr-close');
  if(!e||t===ov||t===cl) ov.classList.remove('open');
}
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});

// Request fullscreen on first interaction (hides browser bar on mobile)
var fullscreenDone=false;
function tryFullscreen(){
  if(fullscreenDone) return;
  fullscreenDone=true;
  var el=document.documentElement;
  var req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
  if(req) req.call(el).catch(function(){});
}
document.addEventListener('touchstart',tryFullscreen,{once:true});
document.addEventListener('click',tryFullscreen,{once:true});
</script>
